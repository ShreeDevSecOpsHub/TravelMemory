[defaults]
# Ansible configuration file for TravelMemory playbooks

# Inventory file location (relative to parent ansible directory)
inventory = ../inventory.ini

# Remote user for SSH connections
remote_user = ec2-user

# SSH key location (relative to parent ansible directory)
private_key_file = ../durga-windows.pem

# Disable host key checking for first-time connections
host_key_checking = False

# Connection timeout (in seconds)
timeout = 30

# Number of parallel processes
forks = 5

# Gather facts
gathering = smart

# Cache facts locally for performance
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

# Logging
log_path = ../ansible.log

# Roles path (relative to this config file location)
roles_path = ../roles

# Variable precedence
hash_behaviour = replace

# Task name display length
display_skipped_hosts = True

[ssh_connection]
# SSH connection options
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
