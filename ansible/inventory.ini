# Ansible Inventory for TravelMemory MERN Application
# Update the IP addresses with actual values from Terraform outputs

[webservers]
# Web Server - 51.24.16.138
web_server ansible_host=51.24.16.138 ansible_user=ec2-user ansible_ssh_private_key_file=./durga-windows.pem ansible_port=22

[dbservers]
# Database Server - 35.179.134.213
db_server ansible_host=35.179.134.213 ansible_user=ec2-user ansible_ssh_private_key_file=./durga-windows.pem ansible_port=22

[webservers:vars]
# Ansible variables for web servers
nodejs_version=18
npm_version=9
app_port=3000
mern_app_repo=https://github.com/durganaresh83/TravelMemory.git
mern_app_branch=feature/terraform_ansible
app_name=travelmemory
app_user=nodejs
app_home=/home/nodejs/applications

[dbservers:vars]
# Ansible variables for database servers
mongodb_version=5.0
mongodb_port=27017
mongodb_user=mongoadmin
mongodb_database=travelmemory

[all:vars]
# Common variables
project_name=durga-TravelMemory
environment=development
region=eu-west-2
ansible_connection=ssh
ansible_ssh_common_args=-o StrictHostKeyChecking=no
